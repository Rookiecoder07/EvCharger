<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Wallet</title>
    <link rel="stylesheet" href="Wallet.css">
</head>

<body>

    <header>
        <h1>My Wallet</h1>
    </header>

    <main>

        <section class="points-card">
            <p>EV Points</p>
            <h2>1,250</h2>
            <p>Available Rewards</p>
        </section>

        <section class="quick-actions">

            <div class="action">
                <span>🎁</span>
                <p>Rewards</p>
            </div>

            <div class="action">
                <span>❤️</span>
                <p>Favorite Stations</p>
            </div>

            <div class="action">
                <span>⭐</span>
                <p>My Reviews</p>
            </div>

        </section>

        <section>
            <h2>Favorite Stations</h2>

            <div class="station">
                <h3>Tata Power EV Station</h3>
                <p>⭐ 4.5 · 2.4 km away</p>
            </div>

        </section>

        <section>
            <h2>Recent Activity</h2>

            <div class="activity">
                <p>⚡ Charging completed</p>
                <span>+50 points</span>
            </div>

            <div class="activity">
                <p>⭐ Station review</p>
                <span>+10 points</span>
            </div>

        </section>

    </main>

</body>
</html>
